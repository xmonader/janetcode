name: release
# A pushed v* tag publishes the binaries from `make dist` with their
# SHA256SUMS as a GitHub release, and a multi-arch image to GHCR.
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  packages: write
jobs:
  binaries:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # A tag is not a release until the tests pass on it.
      - name: test
        run: go test ./...
      - name: build
        run: make dist VERSION=${{ github.ref_name }}
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="See CHANGELOG.md. Check a download with: sha256sum -c SHA256SUMS --ignore-missing"
          gh release create "${{ github.ref_name }}" dist/* --title "${{ github.ref_name }}" --notes "$notes" --verify-tag
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
