name: ci
on:
  push:
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # gofmt -l prints and exits 0 either way, so it is gated by hand —
      # matches the Makefile's `check` target.
      - name: gofmt
        run: |
          fmt_out="$(gofmt -l cmd internal)"
          if [ -n "$fmt_out" ]; then
            echo "$fmt_out"
            echo "::error::gofmt -l found unformatted files (run: gofmt -w cmd internal)"
            exit 1
          fi
      - name: vet
        run: go vet ./...
      - name: build
        run: go build ./...
      # Includes internal/archtest (the package-dependency-direction
      # tests) and every other package under ./...; nothing here narrows
      # or skips it.
      - name: test (race)
        run: go test -race ./...
      # The other two platforms the Makefile's `check` target compile-checks:
      # a build-tagged file that compiles on one OS and not another is
      # otherwise only found by whoever happens to run `make cross`.
      - name: vet (windows/amd64)
        run: GOOS=windows GOARCH=amd64 go vet ./...
      - name: build (windows/amd64)
        run: GOOS=windows GOARCH=amd64 go build ./...
      - name: vet (darwin/arm64)
        run: GOOS=darwin GOARCH=arm64 go vet ./...
  # The test suite on the two platforms the Linux job only compiles for.
  # A compile check says nothing about the PowerShell path, path
  # separators, drive-rooted paths, file locking or CRLF checkouts, and
  # wine (the only Windows available locally) runs neither PowerShell 7
  # nor Git for Windows' shell. fail-fast is off so one platform's
  # failures do not hide the other's.
  test-os:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # This checkout byte-exact (testdata and golden files are compared
      # byte for byte), without touching the global setting: the
      # repositories the tests create must see Git for Windows' default
      # core.autocrlf=true, as a user's do.
      - name: checkout without line-ending conversion
        shell: bash
        run: |
          git config core.autocrlf false
          git rm -rq --cached .
          git reset -q --hard
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: build
        run: go build ./...
      - name: test
        run: go test ./...
  # The page's own checks. `make check` runs the first two locally; without
  # this job the markdown renderer's XSS corpus and the contrast checks were
  # never run in CI, and nothing drove the page in a browser. ui-visual is
  # left out: its pixel baselines are tied to the fonts on the machine
  # that made them.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: markdown renderer corpus
        run: make md-test
      - name: contrast
        run: make ui-a11y
      - name: browser (interaction)
        run: make ui-test
      - name: browser (first run)
        run: make ui-firstrun
      - name: browser (real turns against a scripted model)
        run: make ui-turn
      - name: browser (console-error smoke over every view)
        run: make ui-smoke
