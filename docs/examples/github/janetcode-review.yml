# Copy to .github/workflows/janetcode-review.yml: every pull request gets a
# review comment from janetcode. It runs read-only, so it cannot change the
# repository, and stops at one dollar.
name: janetcode review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: xmonader/janetcode@master
        with:
          mode: review
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          max-cost: "1.00"
