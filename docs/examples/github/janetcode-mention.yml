# Copy to .github/workflows/janetcode-mention.yml: a comment containing
# @janetcode on an issue or a pull request, written by an owner, member or
# collaborator, gets an answer. With allow-edits it may also change files;
# its changes land on a new branch with a pull request of their own.
name: janetcode mention

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  answer:
    if: contains(github.event.comment.body, '@janetcode')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: xmonader/janetcode@master
        with:
          mode: mention
          allow-edits: "true"
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          openai-base-url: https://openrouter.ai/api/v1
          model: deepseek/deepseek-v4-flash
          max-cost: "2.00"
